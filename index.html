<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Asset Manager</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent-blue: #0ea5e9;
            --accent-green: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .badge-pill {
            background: rgba(14, 165, 233, 0.1);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge {
            background: rgba(34, 197, 94, 0.1);
            color: var(--accent-green);
            border: 1px solid var(--border-color);
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .card-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .card-value {
            font-size: 20px;
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .search-input {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
        }

        .btn-refresh {
            background-color: var(--accent-blue);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-refresh:hover {
            opacity: 0.9;
        }

        .table-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        tr:last-child td {
            border-bottom: none;
        }

        code {
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }

        #loading {
            padding: 20px;
            text-align: center;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-title">
            <h1>Azure Asset Manager</h1>
            <span class="badge-pill">Serverless Architecture</span>
        </div>
        <div class="status-badge">
            <span style="color: var(--accent-green);">●</span> Azure Functions API: Active
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="card-label">MANAGED ASSETS</div>
            <div class="card-value" id="totalCount">3</div>
        </div>
        <div class="card">
            <div class="card-label">IDENTITY & ACCESS</div>
            <div class="card-value" style="color: var(--accent-green);">Entra ID (RBAC)</div>
        </div>
        <div class="card">
            <div class="card-label">CLOUD BACKEND</div>
            <div class="card-value" style="color: var(--accent-blue);">Azure Functions API</div>
        </div>
        <div class="card">
            <div class="card-label">DEPLOYMENT PIPELINE</div>
            <div class="card-value" style="color: #38bdf8;">GitHub Actions CI/CD</div>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" class="search-input" placeholder="Asset durchsuchen...">
        <button id="refreshBtn" class="btn-refresh">Daten aktualisieren</button>
    </div>

    <div id="loading" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
    <span style="color: #f59e0b; font-size: 18px;">⚡</span> Einen Moment Geduld... Daten werden aus Azure geladen.
</div>
        <table>
            <thead>
                <tr>
                    <th>RESOURCE ID</th>
                    <th>ASSET NAME</th>
                    <th>KATEGORIE</th>
                    <th>STATUS</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Dynamische Daten -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let allAssets = [];

    async function loadAssets(retries = 3, delay = 1200) {
        const loadingEl = document.getElementById('loading');
        const tableBody = document.getElementById('tableBody');
        const totalCount = document.getElementById('totalCount');
        
        if (loadingEl) loadingEl.style.display = 'block';

        for (let i = 0; i < retries; i++) {
            try {
                const response = await fetch('https://func-demo-api-ec-fkfrbxd8aah2dthq.austriaeast-01.azurewebsites.net/api/GetAssets');
                
                if (!response.ok) {
                    throw new Error(`HTTP-Fehler: ${response.status}`);
                }
                
                const data = await response.json();
                allAssets = data;
                
                if (totalCount) totalCount.innerText = data.length;
                
                renderTable(data);

                // Erfolgreich geladen -> Ladeanzeige ausblenden & beenden
                if (loadingEl) loadingEl.style.display = 'none';
                return;

            } catch (error) {
                console.warn(`Versuch ${i + 1} von ${retries} fehlgeschlagen. Cold Start wird abgewartet...`);
                
                if (i < retries - 1) {
                    // Warten vor dem nächsten Retry
                    await new Promise(resolve => setTimeout(resolve, delay));
                } else {
                    // Erst nach allen Versuchen Fehlermeldung zeigen
                    if (loadingEl) loadingEl.style.display = 'none';
                    if (tableBody) {
                        tableBody.innerHTML = `
                            <tr>
                                <td colspan="4" style="color: #ef4444; text-align: center; padding: 20px;">
                                    Fehler beim Laden der Daten aus Azure. Bitte später erneut versuchen.
                                </td>
                            </tr>`;
                    }
                }
            }
        }
    }

    function renderTable(assets) {
        const tableBody = document.getElementById('tableBody');
        if (!tableBody) return;

        if (!assets || assets.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px;">Keine Assets gefunden.</td></tr>';
            return;
        }

        tableBody.innerHTML = assets.map(asset => {
            const assetName = asset.name || asset.assetName || 'Unbenannt';
            
            // Falls der Asset Name "Windows Server" enthält -> STATUS "Running", sonst "Active"
            let statusText = asset.status || 'Active';
            if (assetName.toLowerCase().includes('windows server')) {
                statusText = 'Running';
            }

            return `
                <tr>
                    <td><code>${asset.id || asset.resourceId || 'N/A'}</code></td>
                    <td><strong>${assetName}</strong></td>
                    <td><span class="badge-pill">${asset.category || asset.kategorie || 'Azure Resource'}</span></td>
                    <td><span style="color: var(--accent-green); font-weight: 600;">● ${statusText}</span></td>
                </tr>
            `;
        }).join('');
    }

    function filterAssets() {
        const searchInput = document.getElementById('searchInput');
        if (!searchInput) return;
        
        const searchTerm = searchInput.value.toLowerCase();
        const filtered = allAssets.filter(asset => {
            const name = (asset.name || asset.assetName || '').toLowerCase();
            const category = (asset.category || asset.kategorie || '').toLowerCase();
            const id = (asset.id || asset.resourceId || '').toLowerCase();
            return name.includes(searchTerm) || category.includes(searchTerm) || id.includes(searchTerm);
        });
        renderTable(filtered);
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadAssets();
        
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', filterAssets);
        }

        const refreshBtn = document.getElementById('refreshBtn');
        if (refreshBtn) {
            refreshBtn.addEventListener('click', () => loadAssets());
        }
    });
</script>

</body>
</html>
