<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azure Asset Manager</title>
<style>
:root {
  --bg: #0b0f19;
  --card: #111827;
  --border: #1f2937;
  --text: #f9fafb;
  --muted: #9ca3af;
  --blue: #0ea5e9;
  --green: #22c55e;
  --amber: #f59e0b;
  --red: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { background: var(--bg); color: var(--text); padding: 20px 15px; display: flex; justify-content: center; }
.container { max-width: 1200px; width: 100%; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; }
.header-title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.header-title h1 { font-size: 24px; font-weight: 700; }
.pill { background: rgba(14,165,233,.1); color: var(--blue); border: 1px solid var(--blue); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }

.api-status { background: var(--card); border: 1px solid var(--border); padding: 6px 14px; border-radius: 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); }
.api-status[data-state="ok"] .dot { background: var(--green); }
.api-status[data-state="error"] .dot { background: var(--red); }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.card-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
.card-value { font-size: 18px; font-weight: 700; }

.controls { display: flex; gap: 12px; margin-bottom: 14px; }
.search { flex: 1; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; color: var(--text); font-size: 14px; }
.search:focus { border-color: var(--blue); outline: none; }
.btn { background: var(--blue); color: #000; border: none; border-radius: 8px; padding: 12px 20px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { opacity: .9; }
.btn:disabled { opacity: .5; cursor: wait; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; min-height: 30px; }
.chip { background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 13px; cursor: pointer; }
.chip:hover { border-color: var(--blue); color: var(--text); }
.chip[aria-pressed="true"] { background: rgba(14,165,233,.12); border-color: var(--blue); color: var(--blue); }

.result-info { font-size: 13px; color: var(--muted); margin-bottom: 10px; }

.table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; min-width: 600px; }
th { background: rgba(255,255,255,.02); color: var(--muted); font-size: 12px; font-weight: 600; padding: 14px 16px; border-bottom: 1px solid var(--border); }
td { padding: 14px 16px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,.02); }
code { background: rgba(255,255,255,.05); padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 12px; word-break: break-all; }
.status { font-weight: 600; }
.status { font-weight: 600; white-space: nowrap; }
.status.ok { color: var(--green); }
.status.warn { color: var(--amber); }
.status.bad { color: var(--red); }
.message { padding: 24px; text-align: center; color: var(--muted); font-size: 14px; }
.message.error { color: var(--red); }
.message .bolt { color: var(--amber); font-size: 18px; margin-right: 8px; }

@media (max-width: 640px) {
  body { padding: 15px 10px; }
  .header { flex-direction: column; align-items: flex-start; }
  .api-status { width: 100%; justify-content: center; }
  .controls { flex-direction: column; }
  .btn { width: 100%; }
  .grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 400px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-title">
      <h1>Azure Asset Manager</h1>
      <span class="pill">Serverless Architecture</span>
    </div>
    <div class="api-status" id="apiStatus" data-state="loading" role="status">
      <span class="dot"></span><span id="apiStatusText">Azure Functions API: verbinde …</span>
    </div>
  </div>

  <div class="grid">
    <div class="card"><div class="card-label">Verwaltete Assets</div><div class="card-value" id="totalCount">0</div></div>
    <div class="card"><div class="card-label">Identität &amp; Zugriff</div><div class="card-value" style="color: var(--green)">Entra ID (RBAC)</div></div>
    <div class="card"><div class="card-label">Cloud-Backend</div><div class="card-value" style="color: var(--blue)">Azure Functions API</div></div>
    <div class="card"><div class="card-label">Deployment</div><div class="card-value" style="color: #38bdf8">GitHub Actions CI/CD</div></div>
  </div>

  <div class="controls">
    <input type="search" id="searchInput" class="search" placeholder="Nach Name, Kategorie, Status oder ID suchen …" aria-label="Assets durchsuchen" autocomplete="off">
    <button id="refreshBtn" class="btn" type="button">Daten aktualisieren</button>
  </div>

  <div class="chips" id="chips" role="group" aria-label="Nach Kategorie filtern"></div>
  <div class="result-info" id="resultInfo" aria-live="polite"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Resource ID</th><th>Asset-Name</th><th>Kategorie</th><th>Status</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
const API_URL = 'https://func-demo-api-ec-fkfrbxd8aah2dthq.austriaeast-01.azurewebsites.net/api/GetAssets';

let allAssets = [];
let activeCategory = null;

const $ = id => document.getElementById(id);

// Alles in Text umwandeln. Das war der Fehler in der alten Suche:
// toLowerCase() stürzt ab, wenn z. B. die ID eine Zahl ist.
const str = v => (v === null || v === undefined) ? '' : String(v);

const escapeHtml = s => str(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Daten einmal vereinheitlichen, damit Anzeige und Suche dieselben Felder nutzen
function normalize(raw) {
  const list = Array.isArray(raw) ? raw : (raw && (raw.value || raw.assets || raw.data)) || [];
  return list.map(a => ({
    id: str(a.id ?? a.resourceId ?? 'N/A'),
    name: str(a.name ?? a.assetName ?? 'Unbenannt'),
    category: str(a.category ?? a.kategorie ?? 'Azure Resource'),
    status: str(a.status ?? 'Active')
  }));
}

function statusClass(status) {
  const s = status.toLowerCase();
  if (/(active|running|online|healthy|succeeded|ok)/.test(s)) return 'ok';
  if (/(active|running|online|healthy|succeeded|ready|ok)/.test(s)) return 'ok';
  if (/(stopped|failed|error|offline|deleted)/.test(s)) return 'bad';
  return 'warn';
}

function setApiStatus(state, text) {
  $('apiStatus').dataset.state = state;
  $('apiStatusText').textContent = 'Azure Functions API: ' + text;
}

function setMessage(text, kind = '') {
  const bolt = kind === 'loading' ? '<span class="bolt" aria-hidden="true">⚡</span>' : '';
  $('tableBody').innerHTML = `<tr><td colspan="4" class="message ${kind}">${bolt}${escapeHtml(text)}</td></tr>`;
}

async function loadAssets(retries = 5) {
  const btn = $('refreshBtn');
  btn.disabled = true;
  setApiStatus('loading', 'verbinde …');
  setMessage('Einen Moment Geduld … Daten werden aus Azure geladen.', 'loading');

  for (let i = 1; i <= retries; i++) {
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      allAssets = normalize(await res.json());

      $('totalCount').textContent = allAssets.length;
      setApiStatus('ok', 'online');
      buildChips();
      render();
      btn.disabled = false;
      return;
    } catch (err) {
      console.warn(`Versuch ${i} von ${retries} fehlgeschlagen:`, err);
      if (i < retries) {
        // Cold Start der Function: Wartezeit wird bei jedem Versuch länger
        setMessage(`Einen Moment Geduld … die Function startet gerade (Cold Start). Versuch ${i + 1} von ${retries}.`, 'loading');
        await new Promise(r => setTimeout(r, 1000 * i));
      }
    }
  }

  allAssets = [];
  $('totalCount').textContent = '0';
  $('chips').innerHTML = '';
  $('resultInfo').textContent = '';
  setApiStatus('error', 'nicht erreichbar');
  setMessage('Die Daten konnten nicht geladen werden. Klicke auf „Daten aktualisieren“, um es erneut zu versuchen.', 'error');
  btn.disabled = false;
}

function buildChips() {
  const cats = [...new Set(allAssets.map(a => a.category))].sort();
  if (activeCategory && !cats.includes(activeCategory)) activeCategory = null;
  const chips = $('chips');
  chips.innerHTML = '';
  if (cats.length < 2) return;

  [null, ...cats].forEach(cat => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = cat === null ? 'Alle' : cat;
    b.setAttribute('aria-pressed', String(cat === activeCategory));
    b.addEventListener('click', () => { activeCategory = cat; buildChips(); render(); });
    chips.appendChild(b);
  });
}

function getFiltered() {
  const words = $('searchInput').value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  return allAssets.filter(a => {
    if (activeCategory && a.category !== activeCategory) return false;
    const haystack = `${a.id} ${a.name} ${a.category} ${a.status}`.toLowerCase();
    return words.every(w => haystack.includes(w)); // jedes Suchwort muss vorkommen
  });
}

function render() {
  const items = getFiltered();
  const info = $('resultInfo');

  if (allAssets.length === 0) { info.textContent = ''; return; }
  info.textContent = items.length === allAssets.length
    ? `${items.length} Assets`
    : `${items.length} von ${allAssets.length} Assets`;

  if (items.length === 0) {
    setMessage('Keine Assets gefunden. Prüfe die Schreibweise oder entferne den Kategorie-Filter.');
    return;
  }

  $('tableBody').innerHTML = items.map(a => `
    <tr>
      <td><code>${escapeHtml(a.id)}</code></td>
      <td><strong>${escapeHtml(a.name)}</strong></td>
      <td><span class="pill">${escapeHtml(a.category)}</span></td>
      <td><span class="status ${statusClass(a.status)}">● ${escapeHtml(a.status)}</span></td>
    </tr>`).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  $('searchInput').addEventListener('input', render);
  $('refreshBtn').addEventListener('click', () => loadAssets());
  loadAssets();
});
</script>
</body>
</html>
