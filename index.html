<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Cloud Asset Management | Dashboard</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .metric-card h3 {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .metric-card p {
            margin: 10px 0 0 0;
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 8px;
            width: 100%;
            max-width: 300px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-blue);
        }

        button {
            background: var(--accent-blue);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            padding: 16px;
            font-size: 0.85rem;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .tag-active {
            color: var(--accent-green);
            background: rgba(34, 197, 94, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        #loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: var(--accent-blue);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Azure Asset Manager <span class="badge">Serverless Architecture</span></h1>
            <div class="status-pill">
                <div class="pulse-dot"></div>
                <span>Azure Functions API: Active</span>
            </div>
        </header>

        <div class="metrics-grid">
            <div class="metric-card">
                <h3>Managed Assets</h3>
                <p id="totalCount">0</p>
            </div>
            <div class="metric-card">
                <h3>Cloud Backend</h3>
                <p>Azure Functions</p>
            </div>
            <div class="metric-card">
                <h3>CI/CD Deployment</h3>
                <p>GitHub Actions</p>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" onkeyup="filterAssets()" placeholder="Asset durchsuchen...">
            <button id="loadBtn" onclick="loadAssets()">Daten aktualisieren</button>
        </div>

        <div id="loading">⚡ Verbinde mit Azure Serverless Backend... Bitte einen Moment Geduld.</div>

        <div class="table-container">
            <table id="assetTable">
                <thead>
                    <tr>
                        <th>Resource ID</th>
                        <th>Asset Name</th>
                        <th>Kategorie</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        let allAssets = [];

        async function loadAssets() {
            const apiUrl = 'https://func-demo-api-ec-fkfrbxd8aah2dthq.austriaeast-01.azurewebsites.net/api/GetAssets';
            const loadingDiv = document.getElementById('loading');
            const loadBtn = document.getElementById('loadBtn');
            const tbody = document.querySelector('#assetTable tbody');

            loadingDiv.style.display = 'block';
            loadBtn.disabled = true;
            tbody.innerHTML = '';
            
            try {
                const response = await fetch(apiUrl);
                allAssets = await response.json();
                renderTable(allAssets);
                document.getElementById('totalCount').innerText = allAssets.length;
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4" style="color: #ef4444; text-align: center;">Fehler beim Laden der Daten aus Azure.</td></tr>`;
            } finally {
                loadingDiv.style.display = 'none';
                loadBtn.disabled = false;
            }
        }

        function renderTable(data) {
            const tbody = document.querySelector('#assetTable tbody');
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Keine Assets gefunden.</td></tr>`;
                return;
            }

            data.forEach(asset => {
                const status = asset.status || asset.Status || 'Active';
                const row = `<tr>
                    <td style="font-family: monospace; color: var(--accent-blue);">${asset.id || asset.ID || '-'}</td>
                    <td><strong>${asset.name || asset.Name || '-'}</strong></td>
                    <td>${asset.category || asset.Category || '-'}</td>
                    <td><span class="tag-active">${status}</span></td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function filterAssets() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allAssets.filter(a => {
                const name = (a.name || a.Name || '').toLowerCase();
                const category = (a.category || a.Category || '').toLowerCase();
                return name.includes(query) || category.includes(query);
            });
            renderTable(filtered);
        }

        loadAssets();
    </script>
</body>
</html>
